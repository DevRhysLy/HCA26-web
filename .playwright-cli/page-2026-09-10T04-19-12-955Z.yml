            - article [ref=f2e52]:
              - heading "HCA Croydon Headquarters" [level=2] [ref=f2e53]
              - paragraph [ref=f2e54]: Located at Level 1, 146 Parramatta Road, Croydon NSW 2132, our Croydon Headquarters serves as the heart of HCA and our primary training facility. As our only full-time location, Croydon offers a comprehensive range of martial arts programs and services for students of all ages and experience levels.
              - paragraph [ref=f2e55]: At Croydon, we proudly offer Little Tigers, Children's Classes, Youth Classes, Adult Classes, Private Lessons, School Programs, and Birthday Parties. Whether you are introducing your child to martial arts, looking to improve your fitness and self-defence skills, or seeking personalised one-on-one instruction, our Croydon facility provides a welcoming environment for every stage of your martial arts journey.
              - paragraph [ref=f2e56]: Our headquarters features two dedicated training rooms, air-conditioned facilities, and high-quality specialised martial arts equipment designed to support safe and effective training. Student safety is one of our highest priorities, which is why all training equipment is routinely inspected, maintained, and cleaned to ensure the highest standards of safety and hygiene.
              - paragraph [ref=f2e57]: More than just a training venue, Croydon is home to a vibrant community of students, instructors, and families who share a passion for personal growth through martial arts. Our classes focus on developing confidence, discipline, fitness, self-defence skills, and leadership qualities in a supportive and encouraging atmosphere.
              - heading "A Small History" [level=3] [ref=f2e58]
              - paragraph [ref=f2e59]: The foundations of HCA can be traced back to February 1999, when Master Young Kil Kim began teaching Taekwondo and Hapkido at the Australian College of Sports. As Head Martial Arts Instructor, he worked with students completing a Diploma in Sports Coaching, sharing his knowledge and passion for martial arts with the next generation of coaches and practitioners.
              - paragraph [ref=f2e60]: Building on this success, Master Kim opened his first dojang in Surry Hills, Sydney in early 2000. As interest in martial arts continued to grow, he expanded further by opening Young's Martial Arts in Homebush in 2003. Through years of dedicated teaching, community involvement, and a commitment to excellence, these beginnings evolved into what is now HCA—a respected martial arts organisation that continues to empower students through traditional values, practical self-defence, and lifelong personal development.
              - paragraph [ref=f2e61]: Today, Croydon remains the centre of HCA's operations, carrying forward the vision of providing high-quality martial arts education while helping students of all ages become stronger, more confident, and more capable individuals.
            - button "Read more" [ref=f2e62]
