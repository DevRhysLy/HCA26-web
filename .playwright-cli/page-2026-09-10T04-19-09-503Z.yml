            - article [ref=f1e58]:
              - heading "Children's Class" [level=2] [ref=f1e59]
              - paragraph [ref=f1e60]: Our Children's Program provides students with the opportunity to develop confidence, focus, discipline, and practical self-defence skills in a fun, supportive, and engaging environment. Available at all HCA studios, this program is designed to help children build strong foundations both on and off the mats.
              - paragraph [ref=f1e61]: Through structured Hapkido training, students learn authentic martial arts techniques while improving their coordination, balance, fitness, and overall physical wellbeing. Classes are designed to challenge students at an age-appropriate level, helping them develop perseverance, resilience, and a growth mindset as they progress through the curriculum.
              - paragraph [ref=f1e62]:
                - img "Child_class_img" [ref=f1e63]
              - paragraph [ref=f1e64]: Beyond physical training, our Children's Program focuses heavily on character development. Students are encouraged to demonstrate respect, self-discipline, responsibility, and teamwork in every class. These values help children build confidence in themselves, improve their ability to concentrate, and develop positive habits that can benefit them at school, at home, and in everyday life.
              - paragraph [ref=f1e65]: Our practical self-defence curriculum teaches children how to stay safe, respond appropriately to challenging situations, and develop greater awareness of their surroundings. Combined with regular physical activity and supportive instruction, students gain valuable life skills while having fun and making new friends.
              - paragraph [ref=f1e66]: At HCA, we believe martial arts is about more than learning techniques—it's about helping young people become confident, capable, and respectful individuals. Our Children's Program provides a positive environment where every student can grow, learn, and reach their full potential.
            - button "Read more" [ref=f1e67]
