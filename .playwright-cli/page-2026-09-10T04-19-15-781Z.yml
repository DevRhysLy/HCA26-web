          - article [ref=f4e51]:
            - heading "Master Young Kil Kim" [level=2] [ref=f4e52]
            - paragraph [ref=f4e53]: Master Young Kil Kim is the founder and Master of HCA and is widely respected for his dedication to martial arts, education, and community development. Originally from South Korea, Master Kim has devoted more than four decades to studying, practising, and teaching martial arts, with a particular focus on traditional Hapkido.
            - paragraph [ref=f4e54]: Beginning his martial arts journey in Incheon, South Korea, in 1979, Master Kim trained extensively under highly respected instructors and developed a deep understanding of Hapkido's techniques, philosophy, and traditions. His passion for sharing these teachings led him to Australia in 1999, where he established a vision to provide authentic Korean martial arts instruction while fostering confidence, discipline, and personal growth in students of all ages.
            - paragraph [ref=f4e55]: As a highly respected member of the Korea Hapkido Federation—the world's largest and most recognised Hapkido organisation—Master Kim maintains strong ties to the art's traditional roots. These affiliations help ensure that HCA students receive instruction that remains true to the principles, techniques, and standards of authentic Korean Hapkido.
            - paragraph [ref=f4e56]: Throughout his career, Master Kim has developed a reputation for creating a professional, structured, and effective training curriculum that caters to children, teenagers, and adults alike. His teaching philosophy extends beyond physical techniques, focusing on character development, leadership, self-discipline, respect, and lifelong learning.
            - paragraph [ref=f4e57]: Under his leadership, HCA has grown into a thriving martial arts community, helping thousands of students improve their fitness, confidence, self-defence skills, and overall wellbeing. His commitment to excellence continues to inspire instructors and students throughout the organisation.
            - heading "Qualifications & Achievements" [level=3] [ref=f4e58]
            - list [ref=f4e59]:
              - listitem [ref=f4e60]: 8th Dan Hapkido
              - listitem [ref=f4e61]: 4th Dan Hwal Bup (Pressure Point & Chiropractic Studies)
              - listitem [ref=f4e62]: 4th Dan Gumdo (Korean Sword)
              - listitem [ref=f4e63]: 2nd Dan Gongkwon Yusul
              - listitem [ref=f4e64]: Certified Sports Master Instructor
              - listitem [ref=f4e65]: Sports Massage Master
            - heading "Career Highlights" [level=3] [ref=f4e66]
            - list [ref=f4e67]:
              - listitem [ref=f4e68]: Began Hapkido training in Incheon, South Korea (1979)
              - listitem [ref=f4e69]: Australian College of Sports Instructor (1999)
              - listitem [ref=f4e70]: Founded his first Hapkido school in Australia, Surry Hills, Sydney (2000)
              - listitem [ref=f4e71]: Member of the Sydney 2000 Olympic Games Demonstration Team
              - listitem [ref=f4e72]: Featured on Channel 7 and Channel 10 during Olympic demonstrations
              - listitem [ref=f4e73]:
                - text: Appeared in the Hollywood blockbuster
                - emphasis [ref=f4e74]: Stealth
                - text: (2005)
              - listitem [ref=f4e75]: Established HCA as one of Australia's leading centres for traditional Korean Hapkido instruction
            - paragraph [ref=f4e76]: Today, Master Kim continues to lead HCA with the same passion and dedication that began over 40 years ago, ensuring that future generations can benefit from the physical, mental, and personal development that martial arts training provides.
